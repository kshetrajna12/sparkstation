[project]
name = "sparkstation"
version = "0.4.0"
description = "Profile-driven model fleet management for NVIDIA DGX Spark"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "kshetrajna12" }
]
license = { file = "LICENSE" }

dependencies = [
    # Core web framework
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",  # /voice/voices/clone multipart upload
    "websockets>=13.0",         # /voice/talk relay to the cascade bot
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.0",

    # LLM Backends (optional, installed separately on system)
    # vllm, sglang are system-level installs with CUDA dependencies

    # Gateway
    "litellm[proxy]>=1.35.8",
    "backoff>=2.2.1",
    "orjson>=3.9.0",
    "prisma>=0.15.0",  # Required by litellm proxy (even without DB)

    # Database
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",

    # Monitoring
    "prometheus-client>=0.20.0",

    # NVIDIA monitoring
    "nvidia-ml-py3>=7.352.0",

    # Utilities
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
]

[project.scripts]
sparkstation = "cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "ipython>=8.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The CLI entry point (project.scripts: sparkstation = "cli:cli") resolves to
# cli.py at the project root, outside the supervisor/ and gateway/ packages;
# cli_init.py likewise, and the Console SPA (console/) is static files the
# supervisor mounts at /console/. All of them must ship in the wheel or the
# installed entry point dies with ModuleNotFoundError.
#
# They are listed under `only-include`, NOT `force-include`: force-include
# paths are COPIED into site-packages even by an editable install, so every
# `uv sync` / `uv pip install -e .` froze a snapshot of cli.py that shadowed
# the checkout for the `sparkstation` entry point (found 2026-09-19: the venv
# copy was 19 days behind HEAD, the systemd tool install 17). With
# only-include the editable wheel is a single .pth pointing at the checkout.
only-include = ["supervisor", "gateway", "cli.py", "cli_init.py", "console"]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
