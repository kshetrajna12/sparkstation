# Per-client access control for the Sparkstation gateway.
#
# Copy to gateway/clients.yaml (gitignored — keys are secrets) and give each
# real client its own key. `sparkstation start` copies this template if
# clients.yaml is missing. The proxy hot-reloads clients.yaml on save — no
# restart needed.
#
# Each request's key (Authorization: Bearer <key>, or x-api-key) is matched to
# a client. A client has:
#   keys:        one or more API keys that map to this client
#   allow:       model-name globs it may call (["*"] = all)
#   rpm:         requests/minute, sliding 60s window (0 = unlimited)
#   concurrency: max simultaneous in-flight requests (0 = unlimited)
#   reasoning:   default thinking level to inject when a request sends none
#                (off | low | medium | high | xhigh). Optional. Only touches
#                chat requests to a reasoning backend (via reasoning.yaml); an
#                explicit client signal always wins. Use for frameworks that
#                mark the model non-reasoning and send no thinking control —
#                openclaw does exactly this, so qwen falls to its xhigh template
#                default and spirals; `low` is the tested sweet spot (higher
#                accuracy than xhigh AND bounded).
#
# concurrency is the real lever on a single-stream GPU: cap a noisy background
# client (scout) so it can't starve an interactive one (foxhole), without
# reordering or queueing anything.

# When true, a key matching no client below is rejected with 401. Leave false
# until every client has a key; then flip to lock the gateway down.
enforce_auth: false

clients:
  # Interactive coding agents — never throttled.
  - name: pi
    keys: ["sk-spark-pi-REPLACE_ME"]
    allow: ["*"]
    rpm: 0
    concurrency: 0

  - name: openclaw
    keys: ["sk-spark-openclaw-REPLACE_ME"]
    allow: ["*"]
    rpm: 0
    concurrency: 0
    reasoning: low     # openclaw sends no thinking control → cap qwen at low

  # Long-horizon agent — explicitly never deprioritised.
  - name: foxhole
    keys: ["sk-spark-foxhole-REPLACE_ME"]
    allow: ["*"]
    rpm: 0
    concurrency: 0
    reasoning: low

  # Background watcher agent — capped so it can't saturate dsv4.
  - name: scout
    keys: ["sk-spark-scout-REPLACE_ME"]
    allow: ["default", "dsv4-flash", "bge-m3", "clip-vit"]
    rpm: 120
    concurrency: 2

  # Benchmark / autoresearch harness — its own key for attribution.
  - name: autoresearch
    keys: ["sk-spark-autoresearch-REPLACE_ME"]
    allow: ["*"]
    rpm: 0
    concurrency: 0

  # image_metadata_indexing app — bursty batch embeddings + VLM description.
  # Bounded concurrency so a big indexing run can't starve interactive clients;
  # scoped to the models it actually calls through :8000 (species-detect goes
  # direct to :8004, not the gateway).
  - name: image-indexing
    keys: ["sk-spark-image-indexing-REPLACE_ME"]
    allow: ["default", "vision", "bge-m3", "clip-vit"]
    rpm: 0
    concurrency: 4

  # Desire Foundry private runtime (autonomous forge-worker + its internal pi
  # coding agents). All its traffic egresses through the df-spark-allowproxy
  # choke point, which stamps THIS key — so the sandbox is attributed as one
  # tenant and can't present another client's key. Bounded concurrency so the
  # autonomous workers can't starve the interactive clients (foxhole/pi).
  - name: desire-foundry
    keys: ["sk-spark-desire-foundry-REPLACE_ME"]
    allow: ["default", "vision", "bge-m3", "clip-vit"]
    rpm: 0
    concurrency: 4
    reasoning: low

# Sparkstation Console playground (supervisor /playground/* proxy; key also in
# .env as GATEWAY_CONSOLE_KEY so the supervisor can present it).
#  - name: console
#    keys: ["sk-spark-console-REPLACE_ME"]
#    allow: ["*"]
#    concurrency: 4
#
# To run enforce_auth: true without breaking local callers (CLI health checks,
# voicecascade brain, SDK examples that use "dummy-key"), register the legacy
# key explicitly:
#  - name: local-ops
#    keys: ["dummy-key"]
#    allow: ["*"]
#    reasoning: low

# Any key not listed above (incl. the legacy "dummy-key"/"sk-local" and the
# CLI's own health checks) falls here. Kept generous so nothing breaks; tighten
# once every client has a real key.
default:
  name: anonymous
  allow: ["*"]
  rpm: 0
  concurrency: 0
