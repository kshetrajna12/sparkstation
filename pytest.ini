[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short

# Markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (requires backends)
    slow: Slow-running tests
