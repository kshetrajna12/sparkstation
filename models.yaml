# Sparkstation Models Configuration
# Define models to auto-load on startup

# Auto-load these models when supervisor starts
autoload:
  enabled: true
  models:
    # Reasoning model with built-in MXFP4 quantization
    - name: "openai/gpt-oss-20b"
      alias: "gpt-oss-20b"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"  # Uses built-in MXFP4
      memory_gb: 35  # 20B with built-in quantization (needs headroom for KV cache)
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 16384
        max_concurrent_requests: 32
        tool_call_parser: "openai"
        reasoning_parser: "openai_gptoss"  # Required for Harmony format multi-turn tool calling

    # Text embedding model for semantic search and RAG
    - name: "BAAI/bge-large-en-v1.5"
      alias: "bge-large"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5  # 1.34GB model + vLLM overhead
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Image embedding model for vision tasks (CLIP)
    # Uses custom transformers-based server for proper image+text embeddings
    - name: "openai/clip-vit-large-patch14"
      alias: "clip-vit"
      backend: "clip"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 5  # 1.71GB model + overhead
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Vision model for image analysis (Qwen3-VL with FP8 quantization)
    # NOTE: Loaded LAST among vLLM models - vision encoder profiling is slow,
    # other models must finish loading first to avoid memory race condition
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"  # FP8 is built into model weights
      memory_gb: 23  # FP8 5B vision model (actual ~20GB)
      idle_timeout_minutes: 30
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 4096  # Reduced from 8192 due to KV cache memory constraints
        max_concurrent_requests: 32
        tool_call_parser: "hermes"  # Qwen uses hermes-style tool calling

    # Image generation model using FLUX.1-dev
    # NOTE: Loaded AFTER other models to avoid memory race condition
    - name: "black-forest-labs/FLUX.1-dev"
      alias: "flux-dev"
      backend: "flux"
      model_type: "image"
      quantization: "none"
      memory_gb: 35  # Measured: 33.5GB actual usage
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        steps: 50
        guidance_scale: 3.5

# Named profiles for different use cases
profiles:
  # Development profile - lightweight models
  dev:
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      quantization: "none"

  # Production profile - full model set
  prod:
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      quantization: "none"
      extra_args:
        max_model_len: 4096

    - name: "openai/gpt-oss-20b"
      alias: "gpt-oss-20b"
      backend: "vllm"
      quantization: "none"
      extra_args:
        max_model_len: 16384
        tool_call_parser: "openai"
        reasoning_parser: "openai_gptoss"

  # Inference only - no auto-suspend
  inference:
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      quantization: "none"
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 4096

  # OpenClaw mode - Nemotron 3 Nano 30B + embeddings + vision (~53 GiB total)
  openclaw:
    - name: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4"
      alias: "nemotron3-nano"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"
      memory_gb: 36
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      docker_image: "nvcr.io/nvidia/vllm:26.01-py3"
      env_vars:
        VLLM_USE_FLASHINFER_MOE_FP4: "1"
      volumes:
        - "nano_v3_reasoning_parser.py:/workspace/nano_v3_reasoning_parser.py"
      extra_args:
        max_model_len: 65536
        max_concurrent_requests: 8
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "nano_v3"
        reasoning_parser_plugin: "/workspace/nano_v3_reasoning_parser.py"
        kv_cache_dtype: "fp8"
        shm_size: "64g"

    - name: "BAAI/bge-large-en-v1.5"
      alias: "bge-large"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5
      docker_image: "nvcr.io/nvidia/vllm:26.01-py3"

    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"
      memory_gb: 14
      docker_image: "nvcr.io/nvidia/vllm:26.01-py3"
      extra_args:
        max_model_len: 4096
        max_concurrent_requests: 4
        tool_call_parser: "hermes"

  # Image indexing mode - VL-30B + text embeddings + CLIP + species detection (~47.5 GiB total)
  image-indexing:
    - name: "Qwen/Qwen3-VL-30B-A3B-Instruct-FP8"
      alias: "qwen3-vl-30b"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"
      memory_gb: 55
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 65536
        max_concurrent_requests: 4
        tool_call_parser: "hermes"
        # EAGLE3 spec decoding - blocked by vLLM bug (image_token_index vs image_token_id)
        # speculative_model: "modal-labs/qwen3-vl-30b-a3b-eagle3-v0"
        # num_speculative_tokens: 5

    - name: "BAAI/bge-large-en-v1.5"
      alias: "bge-large"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5

    - name: "openai/clip-vit-large-patch14"
      alias: "clip-vit"
      backend: "clip"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 5

    - name: "species-ensemble"
      alias: "species-detect"
      backend: "species"
      model_type: "detection"
      quantization: "none"
      memory_gb: 5  # MegaDetector (~0.3GB) + SpeciesNet classifier (~0.2GB) + iNat21 ViT-L (~1.2GB) + overhead
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
