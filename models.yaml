# Sparkstation Models Configuration
# Define models to auto-load on startup

# Auto-load these models when supervisor starts
autoload:
  enabled: true
  models:
    # Vision model for image analysis
    - name: "Qwen/Qwen2.5-VL-3B-Instruct-AWQ"
      alias: "qwen-vl-3b"
      backend: "vllm"
      model_type: "chat"
      quantization: "awq"
      memory_gb: 32  # AWQ quantized 3B vision model
      idle_timeout_minutes: 30
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 8192
        max_concurrent_requests: 32

    # Reasoning model with built-in MXFP4 quantization
    - name: "openai/gpt-oss-20b"
      alias: "gpt-oss-20b"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"  # Uses built-in MXFP4
      memory_gb: 38  # 20B with built-in quantization
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 16384
        max_concurrent_requests: 32

    # Text embedding model for semantic search and RAG
    - name: "BAAI/bge-large-en-v1.5"
      alias: "bge-large"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5  # 1.34GB model + vLLM overhead
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Image embedding model for vision tasks (CLIP)
    - name: "openai/clip-vit-large-patch14"
      alias: "clip-vit"
      backend: "sglang"  # SGLang for CLIP support
      model_type: "embedding"
      quantization: "none"
      memory_gb: 5  # 1.71GB model + SGLang KV cache overhead
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

# Named profiles for different use cases
profiles:
  # Development profile - lightweight models
  dev:
    - name: "Qwen/Qwen2.5-VL-3B-Instruct-AWQ"
      alias: "qwen-vl-3b"
      backend: "vllm"
      quantization: "awq"

  # Production profile - full model set
  prod:
    - name: "Qwen/Qwen2.5-VL-3B-Instruct-AWQ"
      alias: "qwen-vl-3b"
      backend: "vllm"
      quantization: "awq"
      extra_args:
        max_model_len: 8192

    - name: "openai/gpt-oss-20b"
      alias: "gpt-oss-20b"
      backend: "vllm"
      quantization: "none"
      extra_args:
        max_model_len: 16384

  # Inference only - no auto-suspend
  inference:
    - name: "Qwen/Qwen2.5-VL-3B-Instruct-AWQ"
      alias: "qwen-vl-3b"
      backend: "vllm"
      quantization: "awq"
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 8192
