# Sparkstation Models Configuration
#
# STRUCTURE (iter-6 refactor, 2026-06-30):
#   cluster.hosts.<role> — public role names only. Real IPs / ssh users /
#                          labels for remote roles go in .sparkstation.local.yaml
#                          (gitignored).
#   models.<alias>       — one canonical spec per model. Repeated fields (image,
#                          quantization, flags) live here so they're changed in
#                          exactly one place.
#   profiles.<name>.<alias>: { … } — enables the alias for that profile with
#                          per-profile overrides. Empty {} = use base as-is.
#                          Override values deep-merge over base (extra_args,
#                          env_vars, speculative_extra merge; scalars replace).
#   default_profile      — what CLI defaults to when STARTUP_PROFILE isn't set.
#
# CURRENT DEPLOYMENT (image-indexing): chat runs alone on worker1 with 100 GB
# unified memory (huge KV cache, 262K native context, 8 concurrent seqs); the
# other four backends stay on primary. Multi-agent throughput target.

cluster:
  hosts:
    primary: {}   # local machine — supervisor uses the loopback
    # worker1 (or any additional role) gets its real IP/ssh_user/label from
    # .sparkstation.local.yaml (gitignored). Any profile that references
    # `host: worker1` needs that file present on the machine that runs the
    # supervisor.

# coding = the daily driver (2026-08-15, user decision): DSV4-Flash 2-node
# stack + vision + embeddings. For indexing runs switch stacks with
# `sparkstation stop && sparkstation start -d --profile image-indexing`
# (qwen3.8 on worker1 cannot coexist with DSV4's worker rank).
default_profile: coding

# ─── Canonical model specs (one entry per alias) ────────────────────────────

models:
  qwen3.8-27b:
    # Renamed from qwen3.5-35b 2026-08-14 (alias had drifted 3 models deep).
    # Clients updated in the same sweep: image_metadata_indexing .env, RealtorZero,
    # sparkstation scripts. Qwen3.8-27B: dense 27B hybrid (Gated DeltaNet + Gated
    # Attention), native vision+video, 262K native ctx, MTP-trained.
    # Config = trial-proven 2026-08-14 (23.6 tok/s c=1, 135.5 agg c=8 on primary;
    # see patches/qwen38-trial.sh + memory: muse-glimmer-trial).
    name: "RadixArk/Qwen3.8-27B-NVFP4"
    backend: "vllm"
    model_type: "chat"
    quantization: "modelopt"
    default: true
    vision_default: true  # natively multimodal — "vision" alias resolves here when qwen is the profile's VLM
    memory_gb: 40  # single-host default; image-indexing overrides to 85
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    # vLLM main build 2026-08-11 (has Qwen3_5 arch + working MTP; the June
    # MTP-cudagraph problem does NOT apply to this image — full A/B 2026-08-14).
    docker_image: "vllm/vllm-openai:muse-glimmer-arm64-cu130"
    speculative_method: "mtp"
    num_speculative_tokens: 2
    extra_args:
      max_model_len: 65536
      max_num_batched_tokens: 8192
      max_concurrent_requests: 8
      tool_call_parser: "qwen3_coder"
      reasoning_parser: "qwen3"
      enable_prefix_caching: true
      enable_chunked_prefill: true

  bge-large:
    name: "BAAI/bge-large-en-v1.5"
    backend: "vllm"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 2.5
    idle_timeout_minutes: 30
    auto_suspend_enabled: false

  bge-m3:
    name: "BAAI/bge-m3"
    backend: "vllm"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 4  # 2026-08-15: measured 3.7GB actual RSS under load (earlier 2GB squeeze was under-counted)
    auto_suspend_enabled: false
    docker_image: "nvcr.io/nvidia/vllm:26.01-py3"

  clip-vit:
    name: "openai/clip-vit-large-patch14"
    backend: "clip"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 3  # squeezed 5->3 (2026-08-15): measured 0.64GB RSS; margin for CUDA allocs
    idle_timeout_minutes: 30
    auto_suspend_enabled: false

  species-detect:
    name: "species-ensemble"
    backend: "species"
    model_type: "detection"
    quantization: "none"
    memory_gb: 3  # squeezed 5->3 (2026-08-15): measured 2.2GB under load
    idle_timeout_minutes: 60
    auto_suspend_enabled: false

  face-detect:
    name: "face-recognition"
    backend: "face"
    model_type: "detection"
    quantization: "none"
    memory_gb: 1
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    extra_args:
      # Explicit gallery path: the launcher's fallback default pointed at the
      # pre-reorg workspace layout, so the 2026-07-02 supervisor relaunch came
      # up with no /gallery mount and recognition silently returned
      # num_recognized=0 until 2026-08-09.
      gallery_path: "/home/kshetrajna/.openclaw/workspace/agents/whatsapp-schoolfriends-group/gallery.json"

  dsv4-flash:
    # DeepSeek-V4-Flash-0731 on the Anemll DSpark 2-node TP=2 stack (both
    # Sparks, NVFP4 + nvfp4_ds_mla KV, DSpark spec-decode k=5, 1M ctx).
    # REASONING BUDGET CONTRACT (2026-08-15): max_tokens caps reasoning +
    # content COMBINED. Server default effort is `low` (.env.dspark
    # DEFAULT_THINKING — was `max`, which starved structured-output clients:
    # ~12K reasoning tokens ate any modest budget → empty content,
    # finish_reason=length). Deep reasoning = send chat_template_kwargs
    # {"thinking":true,"reasoning_effort":"high"|"max"} and size max_tokens
    # accordingly, or cap with thinking_token_budget. Same class of care
    # applies to qwen3.8-27b (thinking hybrid) under other profiles.
    # The dspark launcher wraps ~/dsv4-2xspark start/stop scripts — it does
    # NOT build docker commands. `name` is the SERVED model name (what
    # /v1/models reports and what LiteLLM must send), not a HF path; the
    # stack's .env.dspark decides the actual checkpoint.
    name: "deepseek-v4-flash-0731"
    backend: "dspark"
    model_type: "chat"
    host: primary  # head node; worker rank comes from the stack's .env.dspark
    quantization: "none"  # stack-managed (NVFP4 checkpoint)
    memory_gb: 94  # head-node share; worker1's rank holds a similar amount
    auto_suspend_enabled: false
    extra_args:
      dspark_dir: "/home/kshetrajna/dsv4-2xspark"
      port: 8888
      launch_timeout_seconds: 2700
      head_container: "deepseek-v4-flash-vllm-dspark-1"

  qwen3-vl-4b:
    # Vision model for coding agents (user: "as small a vision model as you
    # need"). Single-node vLLM on worker1, coexisting with DSV4's worker rank
    # — must launch AFTER the dspark stack has GPU-profiled (phase 1 ordering
    # in main.py handles this).
    name: "cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit"
    backend: "vllm"
    model_type: "chat"
    vision_default: true  # gateway "vision" alias resolves here in coding profile
    host: worker1
    quantization: "awq"  # auto-detected; launcher skips the flag for AWQ
    # 12, not 10 (2026-08-16): dsv4's worker rank slowly grows host-side
    # memory after boot; at 10GB the profiler found only 3.53GiB for a KV
    # cache that needs 4.5GiB at max_model_len 32768 → relaunch-looped with
    # "available KV cache memory" errors after a thermal suspend/resume.
    memory_gb: 12  # → gpu_memory_utilization ≈ 0.101
    auto_suspend_enabled: false
    docker_image: "vllm/vllm-openai:muse-glimmer-arm64-cu130"
    extra_args:
      max_model_len: 32768
      max_concurrent_requests: 4

  flux-dev:
    name: "black-forest-labs/FLUX.1-dev"
    backend: "flux"
    model_type: "image"
    quantization: "none"
    memory_gb: 35
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    extra_args:
      steps: 50
      guidance_scale: 3.5

# ─── Profiles (dict of alias → override) ────────────────────────────────────

profiles:
  # Coding profile (2026-08-15): DSV4-Flash (dspark 2-node stack) as the chat
  # daily driver + small vision model on worker1 + embeddings/detection on
  # primary. Fully supervisor-managed since the dspark backend landed.
  coding:
    dsv4-flash:
      default: true  # the "default" gateway alias resolves to DSV4 here
    qwen3-vl-4b: {}
    bge-m3: {}
    clip-vit: {}
    face-detect: {}  # added 2026-08-15 (user request): ~1GB, gallery lives on primary

  # Single-node development / production / inference — chat only on primary,
  # matches pre-cluster defaults.
  dev:
    qwen3.8-27b: {}

  prod:
    qwen3.8-27b: {}

  inference:
    qwen3.8-27b: {}

  # OpenClaw uses chat + text embeddings on a single node.
  openclaw:
    qwen3.8-27b:
      extra_args:
        max_concurrent_requests: 8
    bge-m3: {}

  # Image-indexing (production): dedicated-chat mode. Chat gets all of
  # worker1's 119 GB — massive KV cache, 262K native context, 8 concurrent
  # seqs. Aux backends stay on primary.
  image-indexing:
    qwen3.8-27b:
      # MAX-QUALITY variant (2026-08-17, user decision): official Qwen
      # block-FP8 — documented near-identical to BF16, and the VISION TOWER
      # stays unquantized BF16 (norms/gates/embeddings too), so image
      # understanding takes zero quant hit. ~29GiB weights vs NVFP4's 23;
      # slower single-stream (FP8+MTP measured 14.8 tok/s on qwen-day) but
      # indexing throughput comes from concurrency on a dedicated node.
      name: "Qwen/Qwen3.8-27B-FP8"
      quantization: "none"  # vLLM auto-detects the HF fp8 block-quant config
      host: worker1
      memory_gb: 90  # dedicated node; +5 over NVFP4-era 85 for the fatter weights
      extra_args:
        max_model_len: 262144  # native max; hybrid arch keeps KV cheap (DeltaNet layers = constant state)
        max_concurrent_requests: 8
        # medium, not the template default xhigh: community-verified that
        # xhigh overthinks pathologically (Simon Willison 2026-08-16: 22K
        # reasoning tokens / 21 min on trivial prompts). Clients can still
        # request any effort per-call via chat_template_kwargs.
        default_chat_template_kwargs: '{"thinking": true, "reasoning_effort": "medium"}'
    bge-m3: {}
    clip-vit: {}
    species-detect: {}
    face-detect: {}
