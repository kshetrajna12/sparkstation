# Sparkstation Models Configuration
# Define models to auto-load on startup

# Auto-load these models when supervisor starts
autoload:
  enabled: true
  models:
    # Reasoning model with built-in MXFP4 quantization
    - name: "openai/gpt-oss-20b"
      alias: "gpt-oss-20b"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"  # Uses built-in MXFP4
      memory_gb: 35  # 20B with built-in quantization (needs headroom for KV cache)
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 16384
        max_concurrent_requests: 32

    # Text embedding model for semantic search and RAG
    - name: "BAAI/bge-large-en-v1.5"
      alias: "bge-large"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5  # 1.34GB model + vLLM overhead
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Image embedding model for vision tasks (CLIP)
    - name: "openai/clip-vit-large-patch14"
      alias: "clip-vit"
      backend: "sglang"  # SGLang for CLIP support
      model_type: "embedding"
      quantization: "none"
      memory_gb: 5  # 1.71GB model + SGLang KV cache overhead
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Vision model for image analysis (Qwen3-VL with FP8 quantization)
    # NOTE: Loaded LAST among vLLM models - vision encoder profiling is slow,
    # other models must finish loading first to avoid memory race condition
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      model_type: "chat"
      quantization: "none"  # FP8 is built into model weights
      memory_gb: 23  # FP8 5B vision model (actual ~20GB)
      idle_timeout_minutes: 30
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 4096  # Reduced from 8192 due to KV cache memory constraints
        max_concurrent_requests: 32

    # Image generation model using FLUX.1-dev
    # NOTE: Loaded AFTER other models to avoid memory race condition
    - name: "black-forest-labs/FLUX.1-dev"
      alias: "flux-dev"
      backend: "flux"
      model_type: "image"
      quantization: "none"
      memory_gb: 35  # Measured: 33.5GB actual usage
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        steps: 50
        guidance_scale: 3.5

# Named profiles for different use cases
profiles:
  # Development profile - lightweight models
  dev:
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      quantization: "none"

  # Production profile - full model set
  prod:
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      quantization: "none"
      extra_args:
        max_model_len: 4096

    - name: "openai/gpt-oss-20b"
      alias: "gpt-oss-20b"
      backend: "vllm"
      quantization: "none"
      extra_args:
        max_model_len: 16384

  # Inference only - no auto-suspend
  inference:
    - name: "Qwen/Qwen3-VL-4B-Instruct-FP8"
      alias: "qwen3-vl-4b"
      backend: "vllm"
      quantization: "none"
      auto_suspend_enabled: false
      extra_args:
        max_model_len: 4096
