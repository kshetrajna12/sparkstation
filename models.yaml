# Sparkstation Models Configuration
# Define models to auto-load on startup
#
# Unified on Qwen3.6-35B-A3B with NVFP4 + MTP speculative decoding, following the
# NVIDIA model-card recipe for nvidia/Qwen3.6-35B-A3B-NVFP4.
# - autoresearch iter-5 (2026-06-05): swapped from MXFP4 + namake-taro patches to
#   NVFP4 + Marlin MoE + Flashinfer attention + built-in MTP head.
# - Why NVFP4: Blackwell 5th-gen Tensor Cores execute NVFP4 natively. Halves weights
#   from MXFP4 (~22GB → ~11GB on disk) and unblocks upstream vLLM (MARLIN MXFP4 MoE
#   kernel on sm_121 had a shared-mem race that pinned us to vllm-qwen35-mxfp4:cu130).
# - Why MTP: Qwen3.6-35B-A3B ships a multi-token prediction head; method "mtp" runs
#   it via the base model with no separate draft model.
# - sm_121a env vars + flag set per HF model card:
#   https://huggingface.co/nvidia/Qwen3.6-35B-A3B-NVFP4
# - Alias "qwen3.5-35b" intentionally preserved for client backward compatibility;
#   do NOT rename — downstream clients pin that string.
# - Rollback path: revert this file (or git checkout previous models.yaml) and run
#   `sparkstation models swap qwen3.5-35b`.

# Auto-load these models when supervisor starts
autoload:
  enabled: true
  models:
    # autoresearch iteration #5: NVFP4 + built-in MTP (qwen3_next_mtp)
    - name: "nvidia/Qwen3.6-35B-A3B-NVFP4"
      alias: "qwen3.5-35b"
      backend: "vllm"
      model_type: "chat"
      quantization: "modelopt"
      memory_gb: 40
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      docker_image: "vllm/vllm-openai:nightly"
      speculative_method: "mtp"
      num_speculative_tokens: 1
      speculative_extra:
        moe_backend: "triton"
      env_vars:
        VLLM_USE_FLASHINFER_MOE_FP4: "0"
        VLLM_FP8_MOE_BACKEND: "flashinfer_cutlass"
        FLASHINFER_DISABLE_VERSION_CHECK: "1"
        CUTE_DSL_ARCH: "sm_121a"
      extra_args:
        max_model_len: 65536
        max_num_batched_tokens: 8192
        max_concurrent_requests: 4
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "qwen3"
        kv_cache_dtype: "fp8"
        enable_prefix_caching: true
        enable_chunked_prefill: true
        moe_backend: "marlin"
        attention_backend: "flashinfer"
        async_scheduling: true
        dtype: "auto"

    # Text embedding model for semantic search and RAG
    - name: "BAAI/bge-large-en-v1.5"
      alias: "bge-large"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Image embedding model for vision tasks (CLIP)
    - name: "openai/clip-vit-large-patch14"
      alias: "clip-vit"
      backend: "clip"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 5
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Image generation model using FLUX.1-dev
    - name: "black-forest-labs/FLUX.1-dev"
      alias: "flux-dev"
      backend: "flux"
      model_type: "image"
      quantization: "none"
      memory_gb: 35
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        steps: 50
        guidance_scale: 3.5

