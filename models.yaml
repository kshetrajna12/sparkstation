# Sparkstation Models Configuration
# Define models to auto-load on startup
#
# Unified on Qwen3.5-35B-A3B with MXFP4 quantization (namake-taro patches)
# - Replaces: qwen3-vl-30b, gpt-oss-20b, qwen3-vl-4b, nemotron3-nano
# - Natively multimodal (vision + text), tool calling, reasoning
# - 54.7 tok/s on GB10 with MXFP4, TTFT p50=81ms
# - Docker image: vllm-qwen35-mxfp4:cu130

# Auto-load these models when supervisor starts
autoload:
  enabled: true
  models:
    # autoresearch iteration #1: Qwen3.6-35B-A3B runtime MXFP4
    # (same alias, same docker image, same extra_args as Qwen3.5 — only
    # the HF name changed. Arch is qwen3_5_moe for both, so the existing
    # vllm-qwen35-mxfp4:cu130 image handles it as a drop-in.)
    - name: "Qwen/Qwen3.6-35B-A3B"
      alias: "qwen3.5-35b"
      backend: "vllm"
      model_type: "chat"
      quantization: "mxfp4"
      memory_gb: 40
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      docker_image: "vllm-qwen35-mxfp4:cu130"
      extra_args:
        max_model_len: 65536
        max_num_batched_tokens: 2096
        max_concurrent_requests: 4
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "qwen3"
        kv_cache_dtype: "fp8"
        enable_prefix_caching: true

    # Text embedding model for semantic search and RAG
    - name: "BAAI/bge-large-en-v1.5"
      alias: "bge-large"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Image embedding model for vision tasks (CLIP)
    - name: "openai/clip-vit-large-patch14"
      alias: "clip-vit"
      backend: "clip"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 5
      idle_timeout_minutes: 30
      auto_suspend_enabled: false

    # Image generation model using FLUX.1-dev
    - name: "black-forest-labs/FLUX.1-dev"
      alias: "flux-dev"
      backend: "flux"
      model_type: "image"
      quantization: "none"
      memory_gb: 35
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      extra_args:
        steps: 50
        guidance_scale: 3.5

# Named profiles for different use cases
profiles:
  # Development profile — single unified model
  dev:
    - name: "Qwen/Qwen3.5-35B-A3B"
      alias: "qwen3.5-35b"
      backend: "vllm"
      model_type: "chat"
      quantization: "mxfp4"
      memory_gb: 40
      default: true
      auto_suspend_enabled: false
      docker_image: "vllm-qwen35-mxfp4:cu130"
      extra_args:
        max_model_len: 65536
        max_num_batched_tokens: 2096
        max_concurrent_requests: 4
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "qwen3"
        kv_cache_dtype: "fp8"
        enable_prefix_caching: true

  # Production profile — single unified model (replaces gpt-oss-20b + qwen3-vl-4b)
  prod:
    - name: "Qwen/Qwen3.5-35B-A3B"
      alias: "qwen3.5-35b"
      backend: "vllm"
      model_type: "chat"
      quantization: "mxfp4"
      memory_gb: 40
      default: true
      auto_suspend_enabled: false
      docker_image: "vllm-qwen35-mxfp4:cu130"
      extra_args:
        max_model_len: 65536
        max_num_batched_tokens: 2096
        max_concurrent_requests: 4
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "qwen3"
        kv_cache_dtype: "fp8"
        enable_prefix_caching: true

  # Inference only
  inference:
    - name: "Qwen/Qwen3.5-35B-A3B"
      alias: "qwen3.5-35b"
      backend: "vllm"
      model_type: "chat"
      quantization: "mxfp4"
      memory_gb: 40
      default: true
      auto_suspend_enabled: false
      docker_image: "vllm-qwen35-mxfp4:cu130"
      extra_args:
        max_model_len: 65536
        max_num_batched_tokens: 2096
        max_concurrent_requests: 4
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "qwen3"
        kv_cache_dtype: "fp8"
        enable_prefix_caching: true

  # OpenClaw mode — unified model + embeddings (~57.5 GiB total)
  # Replaces nemotron3-nano + qwen3-vl-4b with single qwen3.5-35b
  openclaw:
    - name: "Qwen/Qwen3.5-35B-A3B"
      alias: "qwen3.5-35b"
      backend: "vllm"
      model_type: "chat"
      quantization: "mxfp4"
      default: true
      memory_gb: 40
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      docker_image: "vllm-qwen35-mxfp4:cu130"
      extra_args:
        max_model_len: 65536
        max_num_batched_tokens: 2096
        max_concurrent_requests: 8
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "qwen3"
        kv_cache_dtype: "fp8"
        enable_prefix_caching: true

    - name: "BAAI/bge-m3"
      alias: "bge-m3"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5
      auto_suspend_enabled: false
      docker_image: "nvcr.io/nvidia/vllm:26.01-py3"

  # Image indexing mode — unified model + embeddings + CLIP + species (~52.5 GiB total)
  image-indexing:
    # autoresearch iteration #4: Qwen3.6-35B-A3B MXFP4 on upgraded vLLM 0.19.2rc1
    # - Image bumped from vllm-qwen35-mxfp4:cu130 (vLLM 0.17.0, custom namake-taro
    #   patches) to upstream vllm/vllm-openai:nightly (vLLM 0.19.2rc1, MXFP4 native)
    # - load_format: instanttensor brings cold-start from ~5 min to <1 min on Spark
    # - attention_backend: flashinfer set explicitly (was auto-selected anyway)
    # - max_num_batched_tokens: 2096 → 8192 for better concurrent-prefill throughput
    - name: "Qwen/Qwen3.6-35B-A3B"
      alias: "qwen3.5-35b"
      backend: "vllm"
      model_type: "chat"
      quantization: "mxfp4"
      default: true
      memory_gb: 40  # MXFP4 ~18GB weights + ~22GB KV cache
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
      docker_image: "vllm-qwen35:cu130"  # vLLM 0.17.1rc1 — has instanttensor, empty entrypoint, no 0.19 MARLIN-MXFP4 regression. Tried vllm/vllm-openai:nightly (0.19.2rc1) first but its MARLIN MXFP4 MoE backend crashes with "tensor size mismatch 1024 vs 2048" on Qwen3.6 weights. GB10 sm_121 FLASHINFER/TRITON fallbacks also fail priority check, so MARLIN is what vLLM picks — and it's broken. Revisit when vLLM ships native sm_121 MXFP4 kernels.
      extra_args:
        max_model_len: 65536
        max_num_batched_tokens: 8192
        max_concurrent_requests: 4
        tool_call_parser: "qwen3_coder"
        reasoning_parser: "qwen3"
        kv_cache_dtype: "fp8"
        enable_prefix_caching: true
        load_format: "instanttensor"
        attention_backend: "flashinfer"

    - name: "BAAI/bge-m3"
      alias: "bge-m3"
      backend: "vllm"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 2.5
      auto_suspend_enabled: false
      docker_image: "nvcr.io/nvidia/vllm:26.01-py3"

    - name: "openai/clip-vit-large-patch14"
      alias: "clip-vit"
      backend: "clip"
      model_type: "embedding"
      quantization: "none"
      memory_gb: 5
      auto_suspend_enabled: false

    - name: "species-ensemble"
      alias: "species-detect"
      backend: "species"
      model_type: "detection"
      quantization: "none"
      memory_gb: 5
      idle_timeout_minutes: 60
      auto_suspend_enabled: false

    - name: "face-recognition"
      alias: "face-detect"
      backend: "face"
      model_type: "detection"
      quantization: "none"
      memory_gb: 1
      idle_timeout_minutes: 60
      auto_suspend_enabled: false
