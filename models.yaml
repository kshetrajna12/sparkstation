# Sparkstation Models Configuration
#
# STRUCTURE (iter-6 refactor, 2026-06-30):
#   cluster.hosts.<role> — public role names only. Real IPs / ssh users /
#                          labels for remote roles go in .sparkstation.local.yaml
#                          (gitignored).
#   models.<alias>       — one canonical spec per model. Repeated fields (image,
#                          quantization, flags) live here so they're changed in
#                          exactly one place.
#   profiles.<name>.<alias>: { … } — enables the alias for that profile with
#                          per-profile overrides. Empty {} = use base as-is.
#                          Override values deep-merge over base (extra_args,
#                          env_vars, speculative_extra merge; scalars replace).
#   default_profile      — what CLI defaults to when STARTUP_PROFILE isn't set.
#
# CURRENT DEPLOYMENT (image-indexing): chat runs alone on worker1 with 100 GB
# unified memory (huge KV cache, 262K native context, 8 concurrent seqs); the
# other four backends stay on primary. Multi-agent throughput target.

cluster:
  hosts:
    primary: {}   # local machine — supervisor uses the loopback
    # worker1 (or any additional role) gets its real IP/ssh_user/label from
    # .sparkstation.local.yaml (gitignored). Any profile that references
    # `host: worker1` needs that file present on the machine that runs the
    # supervisor.

# generic (default) = daily driver: Qwen3.8-27B on SGLang + DFlash2 (managed).
# deep = DSV4-Flash 2-node reserve. image-indexing = vLLM batch qwen. The
# three worker1 chat deployments are mutually exclusive; switch profiles with
# `sparkstation stop && sparkstation start -d --profile <name>`.
default_profile: generic

# ─── Canonical model specs (one entry per alias) ────────────────────────────

models:
  qwen3.8-27b:
    # Renamed from qwen3.5-35b 2026-08-14 (alias had drifted 3 models deep).
    # Clients updated in the same sweep: image_metadata_indexing .env, RealtorZero,
    # sparkstation scripts. Qwen3.8-27B: dense 27B hybrid (Gated DeltaNet + Gated
    # Attention), native vision+video, 262K native ctx, MTP-trained.
    # Config = trial-proven 2026-08-14 (23.6 tok/s c=1, 135.5 agg c=8 on primary;
    # see patches/qwen38-trial.sh + memory: muse-glimmer-trial).
    name: "RadixArk/Qwen3.8-27B-NVFP4"
    backend: "vllm"
    model_type: "chat"
    quantization: "modelopt"
    default: true
    vision_default: true  # natively multimodal — "vision" alias resolves here when qwen is the profile's VLM
    memory_gb: 40  # single-host default; image-indexing overrides to 85
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    # vLLM main build 2026-08-11 (has Qwen3_5 arch + working MTP; the June
    # MTP-cudagraph problem does NOT apply to this image — full A/B 2026-08-14).
    docker_image: "vllm/vllm-openai:muse-glimmer-arm64-cu130"
    speculative_method: "mtp"
    num_speculative_tokens: 2
    extra_args:
      max_model_len: 65536
      max_num_batched_tokens: 8192
      max_concurrent_requests: 8
      tool_call_parser: "qwen3_coder"
      reasoning_parser: "qwen3"
      enable_prefix_caching: true
      enable_chunked_prefill: true

  bge-large:
    name: "BAAI/bge-large-en-v1.5"
    backend: "vllm"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 2.5
    idle_timeout_minutes: 30
    auto_suspend_enabled: false

  bge-m3:
    name: "BAAI/bge-m3"
    backend: "vllm"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 4  # 2026-08-15: measured 3.7GB actual RSS under load (earlier 2GB squeeze was under-counted)
    auto_suspend_enabled: false
    docker_image: "nvcr.io/nvidia/vllm:26.01-py3"

  clip-vit:
    name: "openai/clip-vit-large-patch14"
    backend: "clip"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 2  # 2026-08-18: nvidia-smi-measured 1.9GB GPU-side (RSS undercounts on GB10); 3GB padding kept it below the memory floor on a packed node
    idle_timeout_minutes: 30
    auto_suspend_enabled: false

  species-detect:
    name: "species-ensemble"
    backend: "species"
    model_type: "detection"
    quantization: "none"
    memory_gb: 3  # squeezed 5->3 (2026-08-15): measured 2.2GB under load
    idle_timeout_minutes: 60
    auto_suspend_enabled: false

  face-detect:
    name: "face-recognition"
    backend: "face"
    model_type: "detection"
    quantization: "none"
    memory_gb: 1
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    extra_args:
      # Explicit gallery path: the launcher's fallback default pointed at the
      # pre-reorg workspace layout, so the 2026-07-02 supervisor relaunch came
      # up with no /gallery mount and recognition silently returned
      # num_recognized=0 until 2026-08-09.
      gallery_path: "/home/kshetrajna/.openclaw/workspace/agents/whatsapp-schoolfriends-group/gallery.json"

  dsv4-flash:
    # DeepSeek-V4-Flash-0731 on the Anemll DSpark 2-node TP=2 stack (both
    # Sparks, NVFP4 + nvfp4_ds_mla KV, DSpark spec-decode k=5, 1M ctx).
    # REASONING BUDGET CONTRACT (2026-08-15): max_tokens caps reasoning +
    # content COMBINED. Server default effort is `low` (.env.dspark
    # DEFAULT_THINKING — was `max`, which starved structured-output clients:
    # ~12K reasoning tokens ate any modest budget → empty content,
    # finish_reason=length). Deep reasoning = send chat_template_kwargs
    # {"thinking":true,"reasoning_effort":"high"|"max"} and size max_tokens
    # accordingly, or cap with thinking_token_budget. Same class of care
    # applies to qwen3.8-27b (thinking hybrid) under other profiles.
    # The dspark launcher wraps ~/dsv4-2xspark start/stop scripts — it does
    # NOT build docker commands. `name` is the SERVED model name (what
    # /v1/models reports and what LiteLLM must send), not a HF path; the
    # stack's .env.dspark decides the actual checkpoint.
    name: "deepseek-v4-flash-0731"
    backend: "dspark"
    model_type: "chat"
    host: primary  # head node; worker rank comes from the stack's .env.dspark
    quantization: "none"  # stack-managed (NVFP4 checkpoint)
    memory_gb: 94  # head-node share; worker1's rank holds a similar amount
    auto_suspend_enabled: false
    extra_args:
      dspark_dir: "/home/kshetrajna/dsv4-2xspark"
      port: 8888
      launch_timeout_seconds: 2700
      head_container: "deepseek-v4-flash-vllm-dspark-1"

  glm5.3-flash:
    # GLM-5.3-Flash (320B-A18B MoE, MIT, 262K ctx) — winner of the 2026-08-28
    # TP2 autoresearch sweep on worker1+worker2: LibertAIDAI NVFP4 + incoai
    # DFlash2 drafter (spec-7) + CUDA graphs + fp8 KV (pinned 4.15GiB), image
    # radixark/vllm-glm53-flash:sm121-v12-dflash2 (tonyd2wild v1-v8 chain +
    # DFlash2 overlay, plus local patches):
    #   v11 — one-shot reasoning in the glm47 parser: stray mid-content
    #         <think> spans at long ctx fragmented content deltas and broke
    #         OpenClaw's NO_REPLY sentinel match (delivered literally, 00:06
    #         2026-08-28).
    #   v12 — SM121 kpool top-k routing: stock persistent_topk hard-crashes
    #         decode past ~24K ctx on GB10's 99KB smem (verified crash-free
    #         to 40K after fix; from tonyd2wild 3a2b793).
    # Serve knobs: --max-num-batched-tokens 8192 --max-num-seqs 12
    # (c4 TTFT 3.8s -> 0.6s, agg +7%; ~15% code-c1 cost, accepted).
    # Measured (v12 final, thinking off, temp 0): c1 29.7 prose / 34.1 code,
    # c4 agg 45/59, TTFT ~0.35s. Context 393216 (stress-gated 2026-08-29: 356K single prefill + 2x137K concurrent PASS; pool 476,625 tok, 1.21x headroom — native 1M needs TP4). Tools+thinking-control gate 4/4.
    # Client note: thinking-off leaks a preamble sentence into content (glm45
    # parser only strips proper think-blocks); prefer thinking ON for clean
    # separation. Teardown must kill BOTH ranks before relaunch (stop script
    # does).
    name: "glm-5.3-flash"   # SERVED model name (what /v1/models reports)
    backend: "dspark"        # generic 2-node script-stack launcher
    model_type: "chat"
    vision_default: true     # natively multimodal (verified 2026-08-28) — gateway "vision" alias
    host: worker1            # head rank; worker2 runs the second rank
    quantization: "none"     # stack-managed (NVFP4 checkpoint)
    memory_gb: 60            # head-rank share; worker2's rank holds similar
    auto_suspend_enabled: false
    extra_args:
      dspark_dir: "/home/kshetrajna/glm53-deploy"
      start_script: "start-glm53-2xspark.sh"
      stop_script: "stop-glm53-2xspark.sh"
      port: 8009
      launch_timeout_seconds: 2400
      head_container: "vllm_glm53"

  qwen3-vl-4b:
    # Vision model for coding agents (user: "as small a vision model as you
    # need"). Single-node vLLM on worker1, coexisting with DSV4's worker rank
    # — must launch AFTER the dspark stack has GPU-profiled (phase 1 ordering
    # in main.py handles this).
    name: "cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit"
    backend: "vllm"
    model_type: "chat"
    vision_default: true  # gateway "vision" alias resolves here in coding profile
    host: worker1
    quantization: "awq"  # auto-detected; launcher skips the flag for AWQ
    # 12, not 10 (2026-08-16): dsv4's worker rank slowly grows host-side
    # memory after boot; at 10GB the profiler found only 3.53GiB for a KV
    # cache that needs 4.5GiB at max_model_len 32768 → relaunch-looped with
    # "available KV cache memory" errors after a thermal suspend/resume.
    memory_gb: 12  # → gpu_memory_utilization ≈ 0.101
    auto_suspend_enabled: false
    docker_image: "vllm/vllm-openai:muse-glimmer-arm64-cu130"
    extra_args:
      max_model_len: 32768
      max_concurrent_requests: 4

  qwen-flash-next:
    # DAILY DRIVER (2026-08-29) — Qwen3.8-Flash-Next 125B-A6B on ONE Spark
    # (worker1), replacing qwen3.8-sglang: model a benchmark tier up,
    # code c1 48.3 tok/s (+13% vs 27B), prose 30.1 (tie), vision native,
    # tools+thinking 4/4, 2x4K-token long-gen stability verified. Trade-off:
    # c4 aggregate 50/98 vs 27B's 81/124 (mmap-PLE contention under load).
    # Stack: Saren-Arterius/qwen3.8-Flash-DGX-AutoRound vLLM fork (worker1
    # ~/qfn-autoround; serve.sh holds the config): Intel W4A16 AutoRound int4
    # experts + int8 head + fp8 side layers (~71GB resident), 44GB fp8 PLE
    # table mmapped from NVMe, MTP=3, 262K ctx, port 8010. Weights:
    # ~/models/qfn-ar-{model,table} (materialized, NOT hub symlinks — the
    # container mount needs real files). Rollback: qwen3.8-sglang spec below.
    # REASONING BUDGET CONTRACT: serve.sh sets server default reasoning_effort
    # LOW (--default-chat-template-kwargs) — without it, default thinking ate
    # modest max_tokens budgets before any JSON content (finish_reason=length;
    # caught by test_structured_output_modest_budget 2026-08-29). Clients
    # request deeper thinking per-call, same as dsv4/glm.
    name: "qwen-flash-next"   # SERVED name (serve.sh SERVED_NAME)
    backend: "dspark"          # generic script-stack launcher
    model_type: "chat"
    host: worker1
    quantization: "none"       # stack-managed (AutoRound hybrid)
    default: true
    vision_default: true
    memory_gb: 78              # ~71GB resident + headroom; PLE stays on NVMe
    auto_suspend_enabled: false
    extra_args:
      dspark_dir: "/home/kshetrajna/qfn-ar-deploy"
      start_script: "start-qfn-ar.sh"
      stop_script: "stop-qfn-ar.sh"
      port: 8010
      launch_timeout_seconds: 1500
      head_container: "qwen38-flash"

  qwen3.8-sglang:
    # RETIRED as daily driver 2026-08-29 (see qwen-flash-next above); kept
    # for rollback. Was: Qwen3.8-27B on SGLang + DFlash2 speculative decoding.
    # Swapped from DSpark 2026-08-21 after a full head-to-head: DFlash2 hits
    # ~66 tok/s net decode C1 on code (vs DSpark ~38) — verified with the
    # recipe's own net-decode bench on worker1. Single-node (second Spark free).
    # Image built locally from the 0xWhiteMage overlay (patch/build-dflash2-image.sh):
    # public SM121 base + 6 checksum-verified DFlash2 selector-capture .py files.
    # Drafter z-lab/Qwen3.8-27B-DFlash2 cached on worker1.
    # CRITICAL: NO torch.compile and NO num-continuous-decode-steps>1 on DFlash2 —
    # the recipe measured them crawling to 3-6 tok/s on this build.
    name: "RadixArk/Qwen3.8-27B-NVFP4"
    backend: "sglang"
    model_type: "chat"
    host: worker1
    quantization: "none"  # SGLang auto-detects NVFP4 from the checkpoint
    default: true          # gateway "default" alias → the daily driver
    vision_default: true   # natively multimodal → gateway "vision" alias
    # 98 → mem-fraction 0.82 (launcher clamp). Actual usage ~80GB (weights +
    # the 1M-token KV pool, bounded by --max-total-tokens), ~40GB OS headroom.
    memory_gb: 98
    idle_timeout_minutes: 120
    auto_suspend_enabled: false
    docker_image: "lmsysorg/sglang:qwen38-27b-dflash2"
    extra_args:
      max_model_len: 262144        # → --context-length; native, safe (no torch.compile)
      docker_memory_gb: 110        # cgroup safety cap: OOM-kills before it can hang the node
      docker_privileged: true      # recipe requirement
      docker_cpuset: "5-9,15-19"   # pin to the ten Cortex-X5 cores (recipe)
      sglang_flags:
        - "--revision"
        - "554ebba9b5f1b79dc11246341960360e6ef05ef4"   # pinned base model rev
        - "--kv-cache-dtype"
        - "fp8_e4m3"
        - "--attention-backend"
        - "flashinfer"
        - "--chunked-prefill-size"
        - "8192"
        - "--disable-prefill-cuda-graph"
        - "--mamba-ssm-dtype"
        - "bfloat16"
        - "--mamba-full-memory-ratio"
        - "4.21"
        - "--mamba-radix-cache-strategy"
        - "extra_buffer"
        - "--max-mamba-cache-size"
        - "20"
        - "--max-running-requests"
        - "4"
        - "--max-total-tokens"
        - "1048576"
        - "--speculative-algorithm"
        - "DFLASH"
        - "--speculative-draft-model-path"
        - "z-lab/Qwen3.8-27B-DFlash2"
        - "--speculative-draft-model-revision"
        - "50307d4c4cde6860d4eee73e2547cd786fe8e8a4"
        - "--speculative-num-draft-tokens"
        - "8"
        - "--speculative-draft-window-size"
        - "2048"
        - "--reasoning-parser"
        - "qwen3"
        - "--tool-call-parser"
        - "qwen3_coder"
        - "--sampling-defaults"
        - "model"
        - "--cuda-graph-max-bs-decode"
        - "4"
        - "--sleep-on-idle"
        - "--enable-priority-scheduling"
        - "--default-priority-value"
        - "0"
        - "--priority-scheduling-preemption-threshold"
        - "10"
        - "--enable-metrics"
        - "--enable-cache-report"

  gemma4-2b:
    # Gemma 4 E2B instruct on worker2 (spark-0908). Variant chosen by on-node
    # A/B 2026-08-25 (bench: scratchpad gemma_bench.py, c=1/4/8, 256 tok):
    #   google QAT w4a16-ct  100 tok/s c=1, 672 agg c=8, TTFT 24ms  ← winner
    #   NVFP4 weight-only     99 tok/s c=1, 617 agg c=8 (prithivMLmods)
    #   BF16 baseline         42 tok/s c=1, 301 agg c=8
    #   unsloth NVFP4        crashes: quantizes E2B's per-layer embeddings
    #                        (KeyError embed_tokens_per_layer.weight_packed)
    # QAT = Google's quantization-aware-trained checkpoint — best quality of
    # the 4-bit options AND fastest. Image: day-1 Gemma 4 image; it force-picks
    # TRITON_ATTN for the heterogeneous head dims automatically.
    name: "google/gemma-4-E2B-it-qat-w4a16-ct"
    backend: "vllm"
    model_type: "chat"
    # Moved worker2 → primary 2026-08-25: VoiceChat 11B needs its qualified
    # memory footprint (Nano engine wants 0.42*121GB free at init) and gemma's
    # 16GB pushed worker2 below it. Weights + gemma4-cu130-audio image exist
    # on both hosts.
    host: primary
    quantization: "none"  # compressed-tensors auto-detected from config.json
    memory_gb: 16
    idle_timeout_minutes: 120
    auto_suspend_enabled: false
    # -audio = gemma4-cu130 + `pip install vllm[audio]` (librosa/soundfile),
    # built on worker2 (~/gemma4-audio-image). Needed for input_audio requests.
    docker_image: "vllm/vllm-openai:gemma4-cu130-audio"
    extra_args:
      max_model_len: 8192
      max_concurrent_requests: 8
      enable_auto_tool_choice: true   # OpenClaw active-memory sends tools
      tool_call_parser: "gemma4"      # native vLLM parser for Gemma 4

  voicechat:
    # NVIDIA NemotronLabs VoiceChat 11B — end-to-end speech-to-speech,
    # full-duplex, tool-calling — via the pipecat DGX Spark runtime
    # (github.com/pipecat-ai/nemotron-voicechat-dgx-spark, checkout at
    # ~/nemotron-voicechat on worker2; bootstrap cache ~65 GiB in
    # ~/.cache/nemotron-voicechat). Quant: community GPTQ W8A16 (Nano LLM) +
    # W8 EarTTS, qualified for GB10. NOTE: qualification pins driver 580.142 /
    # kernel 6.17.0-1014-nvidia — worker2 runs newer (580.173.02 / 1031);
    # works in practice, but on weirdness suspect the version skew first.
    # NOT an OpenAI API — WebSocket/WebRTC audio on :7860 (gateway_sync
    # excludes model_type "voice" from LiteLLM). Clients connect directly:
    # http://<worker2>:7860/client/ (browser needs HTTPS for mic unless
    # loopback; Python/pipecat clients — e.g. the Reachy Mini bridge — don't).
    name: "pipecat-ai/NVIDIA-NemotronLabs-VoiceChat-11B-Spark"
    backend: "voicechat"
    model_type: "voice"
    host: worker2
    quantization: "none"  # runtime-managed (pre-quantized release artifacts)
    # Measured: ~85GB fresh, drifting to ~110GB with session aging — matches
    # NVIDIA's official 80GB-class GPU requirement for this model family.
    # Effectively owns worker2; nothing else fits beside it.
    memory_gb: 105
    auto_suspend_enabled: false
    extra_args:
      voicechat_dir: "/home/kshetrajna/nemotron-voicechat"
      port: 7860
      launch_timeout_seconds: 900
      # Client-executed tool schemas (OpenAI function format, path on worker2):
      # advertised to the model; calls are forwarded to the connected RTVI/WS
      # client as llm-function-call and answered with llm-function-call-result.
      client_tools_file: "/home/kshetrajna/nemotron-voicechat/config/client-tools.json"
      # NOTE (memory-squeeze finding, 2026-08-27): the container's env is
      # FROZEN in the runtime's qualified config (config/*.toml +
      # provenance.py constants) — VOICECHAT_VLLM_* knobs set here reach only
      # the host CLI/bot, NOT the model server. Real footprint: ~85GB fresh,
      # drifting to ~110GB with session aging (periodic restart reclaims it).
      # Tuning the engine pools means forking the frozen candidate — don't.
      extra_env:
        # Dev iteration: skip the image/checkout provenance match so bot-source
        # edits don't force a ~20min no-op image rebuild on cold `up` (our
        # cli.py escape hatch). REMOVE for blessed runs and re-bootstrap.
        VOICECHAT_DEV_BOT: "1"

  flux-dev:
    name: "black-forest-labs/FLUX.1-dev"
    backend: "flux"
    model_type: "image"
    quantization: "none"
    memory_gb: 35
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    extra_args:
      steps: 50
      guidance_scale: 3.5

# ─── Profiles (dict of alias → override) ────────────────────────────────────

profiles:
  # ── THREE-PROFILE STRUCTURE (2026-08-19, post-gauntlet) ─────────────────
  # generic       — DAILY DRIVER (coding/generic). Qwen3.8-27B on SGLang +
  #                 DFlash2 spec-decode (swapped from DSpark 2026-08-21; the
  #                 current recipe — NVFP4 base weights, fp8 KV cache, no
  #                 torch.compile — lives in the qwen3.8-sglang spec above).
  #                 Fully sparkstation-managed on worker1: the supervisor
  #                 launches and health-checks the container, and the gateway
  #                 routes default+vision to it. The old standalone qwen38-best
  #                 container (:30000, restart=unless-stopped) is RETIRED.
  #                 WARNING: never start a standalone SGLang container for
  #                 this model while the managed driver is up — two ~90 GB
  #                 SGLang instances on the 121 GB unified node will wedge it
  #                 (the 0.88-frac incident class; unplug-only recovery).
  #                 Switch profiles with:
  #                 `sparkstation stop && sparkstation start -d --profile <name>`.
  # deep          — RESERVE for hostile/long-horizon work. DSV4-Flash 2-node.
  # image-indexing— BATCH photo intake. Qwen3.8-27B on vLLM+MTP-2 (concurrency-
  #                 tuned, 135 tok/s aggregate c=8 — vLLM MTP batches well,
  #                 unlike SGLang-DSpark which poisons batch, proven 08-18).
  generic:
    qwen-flash-next: {} # DAILY DRIVER chat (Flash-Next AutoRound, single Spark on worker1; default+vision alias; swapped from qwen3.8-sglang 2026-08-29)
    bge-m3: {}          # openclaw/memory-search text embeddings
    clip-vit: {}        # image embeddings (cross-modal search)
    face-detect: {}     # gallery recognition
    gemma4-2b: {}       # small fast chat on primary (Gemma 4 E2B QAT w4a16)

  # voice: the generic stack + Nemotron VoiceChat 11B on worker2 (Reachy/
  # Sparky voice). Deliberately NOT part of generic — voice owns worker2
  # (~85GB fresh, drifts to ~110GB aged) and shouldn't ride every daily-
  # driver restart. Two ways to run it:
  #   full switch:  sparkstation stop && sparkstation start -d --profile voice
  #   on demand:    sparkstation models start voicechat -p voice
  #                 (generic stays up; voice stack starts on worker2 in ~8min;
  #                  stop with: sparkstation models stop voicechat)
  voice:
    qwen-flash-next: {} # daily driver (single Spark, worker1) — leaves worker2 for voicechat
    bge-m3: {}
    clip-vit: {}
    face-detect: {}
    gemma4-2b: {}
    voicechat: {}

  # deep: GLM-5.3-Flash 2-node reserve on worker1+worker2 (swapped from
  # DSV4-Flash 2026-08-28 after the TP2 autoresearch sweep — better agentic
  # benches, 40 tok/s c1 code w/ DFlash2+graphs, MIT license). Chat takes the
  # two workers; EVERYTHING else (gemma, vision, embeddings, aux) runs on
  # primary. DSV4 spec kept above for manual revival (weights cached on
  # primary+worker1).
  deep:
    glm5.3-flash:
      default: true  # gateway "default" alias resolves to GLM in this profile
      # vision alias also resolves here (vision_default in base spec) — GLM is
      # natively multimodal; the separate VL-4B was dropped 2026-08-28.
    gemma4-2b: {}    # small fast chat (base spec host: primary)
    bge-m3: {}
    clip-vit: {}
    face-detect: {}

  # Single-node development / production / inference — chat only on primary,
  # matches pre-cluster defaults.
  dev:
    qwen3.8-27b: {}

  prod:
    qwen3.8-27b: {}

  inference:
    qwen3.8-27b: {}

  # OpenClaw uses chat + text embeddings on a single node.
  openclaw:
    qwen3.8-27b:
      extra_args:
        max_concurrent_requests: 8
    bge-m3: {}

  # Image-indexing (production): dedicated-chat mode. Chat gets all of
  # worker1's 119 GB — massive KV cache, 262K native context, 8 concurrent
  # seqs. Aux backends stay on primary.
  image-indexing:
    qwen3.8-27b:
      # RadixArk NVFP4 (base spec) — quant decision 2026-08-17 after deep
      # research: the documented NVFP4 quality failures are FULL-NVFP4 builds
      # that quantize the (linear-)attention path. RadixArk's mixed recipe
      # keeps attention FP8 and linear-attn/VISION/MTP tensors in BF16 (only
      # MLPs are 4-bit) — measured GSM8K 97.3 / Terminal-Bench 73.8, and our
      # own qwen-day photo replay ranked it best-of-all-models. ~23.6 tok/s
      # vs FP8's 14.8 — usable for coding. Official FP8 stays cached on both
      # nodes for an A/B quality replay if doubts resurface.
      host: worker1
      # 85, NOT 90 (2026-08-19): on GB10 unified memory, static reservations
      # above ~0.75 (≈89GB) risk starving the OS during weight-load — an
      # 0.88 attempt wedged worker1 into an unrecoverable hang (memory:
      # qwen-serving-config-lessons). 85 (≈0.71) is the proven-safe ceiling
      # with 34GB headroom; it already delivered 135 tok/s aggregate at c=8.
      memory_gb: 85
      extra_args:
        max_model_len: 262144  # native max; hybrid arch keeps KV cheap (DeltaNet layers = constant state)
        max_concurrent_requests: 8
        # medium, not the template default xhigh: community-verified that
        # xhigh overthinks pathologically (Simon Willison 2026-08-16: 22K
        # reasoning tokens / 21 min on trivial prompts). Clients can still
        # request any effort per-call via chat_template_kwargs.
        default_chat_template_kwargs: '{"thinking": true, "reasoning_effort": "medium"}'
    bge-m3: {}
    clip-vit: {}
    species-detect: {}
    face-detect: {}
