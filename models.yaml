# Sparkstation Models Configuration
#
# STRUCTURE (iter-6 refactor, 2026-06-30):
#   cluster.hosts.<role> — public role names only. Real IPs / ssh users /
#                          labels for remote roles go in .sparkstation.local.yaml
#                          (gitignored).
#   models.<alias>       — one canonical spec per model. Repeated fields (image,
#                          quantization, flags) live here so they're changed in
#                          exactly one place.
#   profiles.<name>.<alias>: { … } — enables the alias for that profile with
#                          per-profile overrides. Empty {} = use base as-is.
#                          Override values deep-merge over base (extra_args,
#                          env_vars, speculative_extra merge; scalars replace).
#   default_profile      — what CLI defaults to when STARTUP_PROFILE isn't set.
#
# CURRENT DEPLOYMENT (image-indexing): chat runs alone on worker1 with 100 GB
# unified memory (huge KV cache, 262K native context, 8 concurrent seqs); the
# other four backends stay on primary. Multi-agent throughput target.

cluster:
  hosts:
    primary: {}   # local machine — supervisor uses the loopback
    # worker1 (or any additional role) gets its real IP/ssh_user/label from
    # .sparkstation.local.yaml (gitignored). Any profile that references
    # `host: worker1` needs that file present on the machine that runs the
    # supervisor.

default_profile: image-indexing

# ─── Canonical model specs (one entry per alias) ────────────────────────────

models:
  qwen3.5-35b:
    # Alias intentionally preserved for client backward compat — downstream
    # clients (Wildlife Indexer, Caddy routes, saved Cloudflare Access
    # policies) pin this string. Renaming needs a coordinated client sweep.
    #
    # Underlying model has drifted freely under the same alias:
    #   3.5-35B-A3B MXFP4 → 3.6-35B-A3B MXFP4 → nvidia/*-NVFP4 + MTP.
    name: "nvidia/Qwen3.6-35B-A3B-NVFP4"
    backend: "vllm"
    model_type: "chat"
    quantization: "modelopt"
    default: true
    memory_gb: 40  # single-host default; image-indexing overrides to 100
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    # PINNED (2026-07-02): the rolling :nightly (v0.23.1rc1.dev714) generates
    # garbage on GB10 — "!!!!!" with thinking off, never-terminating reasoning
    # with it on (sm_121 FP4 kernel corruption). This tag = image f6353499db8e
    # (v0.22.1rc1.dev195, 2026-06 build), retagged on BOTH hosts. Re-test the
    # rolling nightly before ever unpinning; verify output sanity, not just
    # tok/s — the broken build benches 2× faster while emitting garbage.
    docker_image: "vllm/vllm-openai:nightly-20260611-goodgb10"
    speculative_method: "mtp"
    num_speculative_tokens: 1
    speculative_extra:
      moe_backend: "triton"
    env_vars:
      VLLM_USE_FLASHINFER_MOE_FP4: "0"
      VLLM_FP8_MOE_BACKEND: "flashinfer_cutlass"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      CUTE_DSL_ARCH: "sm_121a"
    extra_args:
      max_model_len: 65536
      max_num_batched_tokens: 8192
      max_concurrent_requests: 4
      tool_call_parser: "qwen3_coder"
      reasoning_parser: "qwen3"
      kv_cache_dtype: "fp8"
      enable_prefix_caching: true
      enable_chunked_prefill: true
      # marlin — the only backend the NvFP4 oracle accepts for this
      # deployment shape (this quant scheme + our env vars). Tried the
      # alternatives on 2026-07-02:
      #   - triton: rejected — "not supported for NvFP4 MoE"
      #   - cutlass: rejected — "does not support the deployment
      #     configuration since kernel does not support quantization
      #     scheme QuantKey(u8, scale(f8e4...))"
      # marlin runs fine but has an intermittent CUDA cudaErrorUnknown
      # in fused_marlin_moe → moe_sum on sm_121 (Blackwell) — hit it
      # ~5h into steady load. Recovery relies on the supervisor's
      # auto-restart machinery, which is being repaired in parallel
      # (Bug A: FAILED transitions weren't triggering restart).
      moe_backend: "marlin"
      attention_backend: "flashinfer"
      async_scheduling: true
      dtype: "auto"

  bge-large:
    name: "BAAI/bge-large-en-v1.5"
    backend: "vllm"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 2.5
    idle_timeout_minutes: 30
    auto_suspend_enabled: false

  bge-m3:
    name: "BAAI/bge-m3"
    backend: "vllm"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 2.5
    auto_suspend_enabled: false
    docker_image: "nvcr.io/nvidia/vllm:26.01-py3"

  clip-vit:
    name: "openai/clip-vit-large-patch14"
    backend: "clip"
    model_type: "embedding"
    quantization: "none"
    memory_gb: 5
    idle_timeout_minutes: 30
    auto_suspend_enabled: false

  species-detect:
    name: "species-ensemble"
    backend: "species"
    model_type: "detection"
    quantization: "none"
    memory_gb: 5
    idle_timeout_minutes: 60
    auto_suspend_enabled: false

  face-detect:
    name: "face-recognition"
    backend: "face"
    model_type: "detection"
    quantization: "none"
    memory_gb: 1
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    extra_args:
      # Explicit gallery path: the launcher's fallback default pointed at the
      # pre-reorg workspace layout, so the 2026-07-02 supervisor relaunch came
      # up with no /gallery mount and recognition silently returned
      # num_recognized=0 until 2026-08-09.
      gallery_path: "/home/kshetrajna/.openclaw/workspace/agents/whatsapp-schoolfriends-group/gallery.json"

  flux-dev:
    name: "black-forest-labs/FLUX.1-dev"
    backend: "flux"
    model_type: "image"
    quantization: "none"
    memory_gb: 35
    idle_timeout_minutes: 60
    auto_suspend_enabled: false
    extra_args:
      steps: 50
      guidance_scale: 3.5

# ─── Profiles (dict of alias → override) ────────────────────────────────────

profiles:
  # Single-node development / production / inference — chat only on primary,
  # matches pre-cluster defaults.
  dev:
    qwen3.5-35b: {}

  prod:
    qwen3.5-35b: {}

  inference:
    qwen3.5-35b: {}

  # OpenClaw uses chat + text embeddings on a single node.
  openclaw:
    qwen3.5-35b:
      extra_args:
        max_concurrent_requests: 8
    bge-m3: {}

  # Image-indexing (production): dedicated-chat mode. Chat gets all of
  # worker1's 119 GB — massive KV cache, 262K native context, 8 concurrent
  # seqs. Aux backends stay on primary.
  image-indexing:
    qwen3.5-35b:
      host: worker1
      memory_gb: 85  # leave ~34 GB headroom on the 119 GB Spark for GB10 UMA stability
      # MTP disabled (iter-6/7, 2026-07-02): spec-decode forces cudagraph_mode
      # down to PIECEWISE with FlashInfer attention on BOTH v0.22 and v0.23
      # nightlies, and benches far below MTP-off (41 vs 72.8 tok/s c=1 for
      # MTP-3 on v0.23; also lost at c=4/8). Full A/B in autoresearch.md.
      speculative_method: null
      env_vars:
        # Engine-suggested Marlin tweak for small-N GEMMs (sm_121).
        VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      extra_args:
        max_model_len: 262144   # native max per NVFP4 model card
        max_num_batched_tokens: 16384
        max_concurrent_requests: 8
    bge-m3: {}
    clip-vit: {}
    species-detect: {}
    face-detect: {}
